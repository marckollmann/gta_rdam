<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rotterdam Underground</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23151d24'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%23ffcc33'%3ER%3C/text%3E%3C/svg%3E">
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="hud">
    <div id="hud-top-left">
      <div id="health-bar-wrap"><div id="health-bar"></div></div>
      <div id="armor-bar-wrap"><div id="armor-bar"></div></div>
      <div id="weapon-info"></div>
    </div>
    <div id="hud-top-right">
      <div id="wanted-stars"></div>
      <div id="cash">&euro;0</div>
      <div id="respect-list"></div>
    </div>
    <canvas id="minimap" width="180" height="180"></canvas>
    <div id="mission-brief"></div>
    <div id="subtitle"></div>
  </div>

  <div id="menu-overlay">
    <div id="menu-panel">
      <h1>ROTTERDAM<span>UNDERGROUND</span></h1>
      <div id="menu-buttons">
        <button id="btn-start">START GAME</button>
        <button id="btn-controls">CONTROLS</button>
      </div>
      <div id="controls-panel" class="hidden">
        <h2>CONTROLS</h2>
        <ul>
          <li><b>WASD</b> — walk / drive</li>
          <li><b>SHIFT</b> — sprint (on foot)</li>
          <li><b>SPACE</b> — jump (over walls, onto car roofs, across gaps)</li>
          <li><b>MOUSE</b> — aim</li>
          <li><b>LEFT CLICK</b> — shoot</li>
          <li><b>RIGHT CLICK</b> — melee</li>
          <li><b>E</b> — enter / exit vehicle</li>
          <li><b>Q</b> — switch weapon</li>
          <li><b>P / ESC</b> — pause</li>
        </ul>
        <button id="btn-close-controls">BACK</button>
      </div>
    </div>
  </div>

  <div id="pause-overlay" class="hidden">
    <div id="pause-panel">
      <h2>PAUSED</h2>
      <button id="btn-resume">RESUME</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
